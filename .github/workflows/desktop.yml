name: Desktop app
# Builds the native Blackbox desktop installers (no Docker inside): macOS arm64 (.dmg) and Windows x64
# (NSIS .exe) in parallel. Each runner builds its own Rust engine; the bundled PostgreSQL and Node.js
# are downloaded per target and checked against the publishers' SHA-256 (apps/desktop/scripts/fetch-runtime.mjs).
# Installers are unsigned build artifacts, not releases.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fetch PostgreSQL and Node.js runtimes
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-runtime.mjs --target ${{ matrix.target }}
      - name: Build and stage services and engine
        working-directory: apps/desktop
        run: node scripts/stage-app.mjs --target ${{ matrix.target }}
      - name: Build installer
        working-directory: apps/desktop
        run: pnpm exec tauri build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackbox-desktop-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
